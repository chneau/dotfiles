# Single source of truth for cross-platform aliases.
# Run `./generate.py` (or `uv run generate.py`) to update:
#   - .aliases
#   - .profile.ps1
#   - .profile.cmd

[aliases]
".." = { sh = "cd ..", ps1 = "Set-Location ..", cmd = "cd .." }
"..." = { sh = "cd ../..", ps1 = "Set-Location ..\\..", cmd = "cd ..\\.." }
"...." = { sh = "cd ../../..", ps1 = "Set-Location ..\\..\\..", cmd = "cd ..\\..\\.." }
a = "ansible"
addselftogroup = { sh = "f(){ sudo adduser $USER $1; exec sudo su -l $USER; unset -f f; }; f" }
agenty = "agent --yolo"
agyy = "agy --dangerously-skip-permissions"
ai-help = { sh = "aihelp", ps1 = "aihelp", cmd = "powershell -NoLogo -Command aihelp" }
aihelp = { sh = "aihelp", cmd = "powershell -c \"aihelp\"", ps1 = "aihelp" }
alert = { sh = "notify-send --urgency=low -i \"$([ $? = 0 ] && echo terminal || echo error)\" \"$(history|tail -n1|sed -e 's/^\\s*[0-9]\\+\\s*//;s/[;&|]\\s*alert$//')\"" }
apti = { sh = "sudo apt install -y" }
aptr = { sh = "sudo apt remove --auto-remove -y" }
b = "bun"
banip = { sh = "sudo iptables -A INPUT -j DROP -s " }
bbmd = "bun build --metafile-md"
bbx = "bun --bun x"
bcp = "bun --cpu-prof-md"
bcphp = "bun --cpu-prof-md --heap-prof-md"
bd = "bun run dev"
bench = "hyperfine"
benchsh = { sh = "wget -qO- bench.sh | bash" }
bfmt = { sh = "bun fmt --no-script; bun lint --fix --no-script", ps1 = "bun fmt --no-script; bun lint --fix --no-script", cmd = "bun fmt --no-script ^& bun lint --fix --no-script" }
bh = "bun --hot --no-clear-screen"
bhp = "bun --heap-prof-md"
bi = "bun install --force --no-save"
bic = { sh = "bun fmt --no-script; bun lint --fix --no-script", ps1 = "bun fmt --no-script; bun lint --fix --no-script", cmd = "bun fmt --no-script ^& bun lint --fix --no-script" }
bo = "bun outdated"
br = "bun run"
brp = "bun run --parallel"
brs = "bun run --sequential"
bs = "bun start"
btop = { sh = "btop || bpytop" }
bup = { sh = "(NO_INPUT=1 NO_PAGER=1 zi update --all --parallel --quiet --no-pager </dev/null & NONINTERACTIVE=1 brew upgrade --yes --quiet </dev/null & bun upgrade </dev/null & npmig </dev/null & updateall & updatebashrc </dev/null & dotnetig </dev/null & uv self update </dev/null & uv tool upgrade --all </dev/null & x upgrade </dev/null & wait); zinit cclear" }
bverbosefetch = { sh = "BUN_CONFIG_VERBOSE_FETCH=curl ", cmd = "set \"BUN_CONFIG_VERBOSE_FETCH=curl\" ^& $* ^& set \"BUN_CONFIG_VERBOSE_FETCH=\"", ps1 = "BUN_CONFIG_VERBOSE_FETCH=curl " }
bw = "bun --watch --no-clear-screen"
bx = "bun x"
bxb = "bun --bun x"
catfull = { sh = "cat --style=full", ps1 = "bat --style=full", cmd = "bat --style=full" }
cc = "concurrently --prefix-colors=auto"
cl = "claude"
cleanos = { sh = "rm -rf bleachbit && HOME= git clone --depth=1 https://github.com/bleachbit/bleachbit && uv run python bleachbit/bleachbit.py --list | grep -v -e system.empty_space -e system.free_disk_space | grep -v system.memory | grep -v deepscan | xargs sudo env PATH=\"$PATH\" uv run python bleachbit/bleachbit.py --clean && rm -rf bleachbit" }
cli-help = { ps1 = "clihelp", cmd = "powershell -NoLogo -Command clihelp" }
clihelp = { sh = "clihelp", cmd = "powershell -c \"clihelp\"", ps1 = "clihelp" }
cly = "claude --dangerously-skip-permissions"
codexy = "codex --dangerously-bypass-approvals-and-sandbox"
