ct = { sh = "column -t", cmd = "powershell -NoLogo -Command \"$input | ct\"", ps1 = "column -t" }
curlt = { sh = "curlt", cmd = "powershell -NoLogo -Command curlt", ps1 = "curlt" }
d = "docker"
db = "docker build --pull --tag"
