dk = { sh = "docker run --pull=always --rm -it --name=kaggle -p=8080:8080 -v=`pwd`:`pwd` -w=`pwd` kaggle/python jupyter notebook --no-browser --notebook-dir=`pwd` --allow-root --port=8080 --ip=\\*", cmd = "powershell -NoLogo -Command dk" }
